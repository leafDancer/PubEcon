[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pubecon"
version = "1.0.0"
description = "PubEcon: top-five economics journal database, coauthor network, and career-stage inference"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "lxml>=5",
    "pypdf>=5",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
dev = ["pytest>=8", "fastapi>=0.115", "uvicorn[standard]>=0.30"]

[project.scripts]
pubecon = "econpub.cli:main"
econpub = "econpub.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
econpub = ["schema.sql"]

[tool.ruff]
line-length = 100
